server:
    port: 9000
spring:
    application:
        name: "cards"
    profiles:
        active: "prod"
    datasource:
        url: jdbc:mysql://localhost:3308/cardsdb
        username: root
        password: ROOT
    jpa:
        show-sql: true
    sql:
        init:
            mode: always
    config:
        import: "optional:configserver:http://localhost:8071/"
    rabbitmq:
        host: "localhost"
        port: 5672
        username: "guest"
        password: "guest"

eureka:
    instance:
        prefer-ip-address: true
    client:
        fetchRegistry: true
        registerWithEureka: true
        serviceUrl:
            defaultZone: http://localhost:8070/eureka/


management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        shutdown:
            access: unrestricted
    info:
        env:
            enabled: true

info:
    app:
        name: "cards"
        description: "Easy Bank Cards Application"
        version: "1.0"